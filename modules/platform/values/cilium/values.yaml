# Talos 1.13 - Without kube-proxy + Gateway API
# Sidero: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium#cli-install Tab "Without kube-proxy + Gateway API"
# Helm equivalent of:
# helm install cilium cilium/cilium --version 1.18.0 --namespace kube-system \
#   --set ipam.mode=kubernetes \
#   --set kubeProxyReplacement=true \
#   --set securityContext.capabilities.ciliumAgent="{CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}" \
#   --set securityContext.capabilities.cleanCiliumState="{NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}" \
#   --set cgroup.autoMount.enabled=false \
#   --set cgroup.hostRoot=/sys/fs/cgroup \
#   --set k8sServiceHost=localhost \
#   --set k8sServicePort=7445 \
#   --set gatewayAPI.enabled=true \
#   --set gatewayAPI.enableAlpn=true \
#   --set gatewayAPI.enableAppProtocol=true

ipam:
  mode: kubernetes

kubeProxyReplacement: true

k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true

# operator.replicas is overridden via Terraform var.cilium_operator_replicas (helm set).
# Default 1 for single-node/dev, use 2 for HA (3+ nodes). Leader election handles failover.
operator:
  replicas: 1
