name: Destroy Talos Cluster

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

concurrency:
  group: tf-deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_ROOT: proxmox
  TF_ENV: prod

jobs:
  destroy:
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4

      - name: Prepare kubeconfig placeholder
        run: mkdir -p secrets/${{ env.TF_ROOT }}/${{ env.TF_ENV }} && touch secrets/${{ env.TF_ROOT }}/${{ env.TF_ENV }}/kubeconfig.yaml

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:terraform
          use-cache: 'true'

      - name: Terraform init
        run: |
          terraform init -reconfigure
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform destroy
        run: |
          terraform destroy -auto-approve -no-color 2>&1 | \
            sed -E 's/[A-Za-z0-9+/=]{80,}/***CERT***/g'
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_enable_health_check: "false"
