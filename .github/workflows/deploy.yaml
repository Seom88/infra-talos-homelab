name: Deploy Talos Cluster

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tf-deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_ROOT: proxmox
  TF_ENV: prod

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}

      - name: Init & validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}

      - name: Platform module format check
        run: terraform fmt -check -recursive
        working-directory: modules/platform

      - name: Platform module init & validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: modules/platform

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4

      - uses: azure/setup-kubectl@v5

      - uses: azure/setup-helm@v5

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:terraform
          use-cache: 'true'

      - name: Restore Terraform state from last successful run
        id: restore-tfstate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Looking for latest artifact: tfstate-${{ env.TF_ROOT }}-${{ env.TF_ENV }}"
          ARTIFACT_ID=$(gh api \
            /repos/${{ github.repository }}/actions/artifacts?name=tfstate-${{ env.TF_ROOT }}-${{ env.TF_ENV }} \
            --jq '.artifacts | sort_by(.created_at) | last | .id' 2>/dev/null || echo "")
          echo "Artifact ID: $ARTIFACT_ID"
          if [ -n "$ARTIFACT_ID" ] && [ "$ARTIFACT_ID" != "null" ]; then
            mkdir -p /tmp/tfstate-restore
            cd /tmp/tfstate-restore
            gh api /repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > tfstate.zip
            unzip -o tfstate.zip 2>/dev/null
            rm -f tfstate.zip
            cd -
            if [ -f /tmp/tfstate-restore/terraform.tfstate ]; then
              mkdir -p environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}
              cp /tmp/tfstate-restore/terraform.tfstate environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}/terraform.tfstate
              echo "✓ State restored"
            else
              echo "State file not found in artifact"
            fi
          else
            echo "No previous artifact found (first run?)"
          fi

      - name: Terraform init
        run: |
          terraform init -reconfigure
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}

      - name: Terraform apply
        run: |
          terraform apply -auto-approve -no-color 2>&1 | \
            sed -E 's/[A-Za-z0-9+/=]{80,}/***CERT***/g'
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}
        env:
          TF_VAR_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Backup Terraform state
        if: always()
        run: |
          if [ -f environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}/terraform.tfstate ]; then
            mkdir -p /tmp/tfstate-backup
            cp environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}/terraform.tfstate /tmp/tfstate-backup/
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tfstate-${{ env.TF_ROOT }}-${{ env.TF_ENV }}
          path: /tmp/tfstate-backup/
          retention-days: 90

      - name: Extract cluster secrets
        run: |
          mkdir -p /tmp/secrets
          terraform output -raw talosconfig > /tmp/secrets/talosconfig.yaml
          terraform output -raw kubeconfig > /tmp/secrets/kubeconfig.yaml
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}

      - uses: actions/upload-artifact@v7
        with:
          name: cluster-secrets-${{ env.TF_ENV }}
          path: /tmp/secrets/
          retention-days: 7

      # ── Platform layer (ArgoCD) is now composed in the environment root ──
      # The single `terraform apply` above deploys both infra and platform
      # (module.platform) in one state file at
      # environments/<provider>/<env>/terraform.tfstate. No separate platform
      # state or apply is needed. See platform/DEPRECATED.md for migration.
