name: Deploy Talos Cluster

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tf-deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_ROOT: proxmox
  TF_ENV: prod

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}

      - name: Init & validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}

      - name: Platform module format check
        run: terraform fmt -check -recursive
        working-directory: modules/platform

      - name: Platform module init & validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: modules/platform

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4

      - uses: azure/setup-kubectl@v5

      - uses: azure/setup-helm@v5

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:terraform
          use-cache: 'true'

      - name: Terraform init
        run: |
          terraform init -reconfigure
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform apply
        run: |
          terraform apply -parallelism=1 -auto-approve -no-color 2>&1 | \
            sed -E 's/[A-Za-z0-9+/=]{80,}/***CERT***/g'
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_api_token: ${{ secrets.PROXMOX_API_TOKEN }}

      - name: Extract cluster secrets
        run: |
          mkdir -p /tmp/secrets
          terraform output -raw talosconfig > /tmp/secrets/talosconfig.yaml
          terraform output -raw kubeconfig > /tmp/secrets/kubeconfig.yaml
        working-directory: environments/${{ env.TF_ROOT }}/${{ env.TF_ENV }}

      - uses: actions/upload-artifact@v7
        with:
          name: cluster-secrets-${{ env.TF_ENV }}
          path: /tmp/secrets/
          retention-days: 7

      # ── Platform layer (ArgoCD) is now composed in the environment root ──
      # The single `terraform apply` above deploys both infra and platform
      # (module.platform) in one state file at
      # environments/<provider>/<env>/terraform.tfstate. No separate platform
      # state or apply is needed. See platform/DEPRECATED.md for migration.
